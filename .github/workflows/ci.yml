# ─────────────────────────────────────────────────────────
# SwiftCare GeoAgent — CI Pipeline
# Runs on every push and pull request
# ─────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  lint-and-build:
    name: Lint, Typecheck & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── Frontend ──
      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build Next.js frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.run.app/api
          NEXT_PUBLIC_SOCKET_URL: https://placeholder.run.app

  backend-tests:
    name: Backend Test Suites & Security Verifications
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Run Database Safety & Retention Tests
        run: |
          node server/test-db-safety.js
          node server/test-telemetry-retention.js

      - name: Run Backend Auth & RBAC Security Tests
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/geoagent-emergency-test
          JWT_SECRET: test-jwt-secret-for-ci-security-testing-only-12345
          DISABLE_RATE_LIMITS: "true"
          PORT: 5001
        run: |
          # Start the backend server in background
          node server/server.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          
          # Wait for backend server to be ready on port 5001
          echo "Waiting for backend server to be ready on port 5001..."
          SERVER_READY=false
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5001/api/health > /dev/null 2>&1; then
              echo "Backend server is listening on port 5001!"
              SERVER_READY=true
              break
            fi
            sleep 1
          done

          if [ "$SERVER_READY" != "true" ]; then
            echo "❌ Backend server failed to start within 30 seconds!"
            exit 1
          fi

          # Run test suites against live server
          node server/test-auth-rbac-complete.js
          node server/test-targeted-rbac-socket.js

      - name: Run Navigation Engine & Emergency Lifecycle Tests
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/geoagent-emergency-test
          JWT_SECRET: test-jwt-secret-for-ci-security-testing-only-12345
        run: |
          node server/test-google-osrm-routing.js
          node server/test-navigation-engine.js
          node server/test-part9.js

      - name: Verify Backend Docker Build
        working-directory: server
        run: docker build -t geoagent-backend-ci-test .
