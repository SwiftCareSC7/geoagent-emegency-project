# ─────────────────────────────────────────────────────────
# SwiftCare GeoAgent — Backend Deployment Workflow (Cloud Run)
# 
# NOTE: Production backend runs on Render via render.yaml.
# Render auto-deploys on git push to the main branch.
#
# This Google Cloud Run workflow can be triggered manually via workflow_dispatch.
# Required credentials in GitHub Repository Settings:
#   Settings → Secrets and variables → Actions:
#     - GCP_PROJECT_ID
#     - GCP_WORKLOAD_IDENTITY_PROVIDER & GCP_SERVICE_ACCOUNT (or GCP_SA_KEY)
# ─────────────────────────────────────────────────────────
name: Deploy Backend (Cloud Run)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVICE_NAME: geoagent-backend
  IMAGE_NAME: geoagent-backend
  GCP_REGION: asia-south1

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GCP Deployment Credentials
        id: check-auth
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS_JSON }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SA" ]; then
            echo "auth_method=wif" >> "$GITHUB_OUTPUT"
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "✅ Found Workload Identity Federation secrets."
          elif [ -n "$SA_KEY" ]; then
            echo "auth_method=key" >> "$GITHUB_OUTPUT"
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "✅ Found Service Account Key JSON secrets."
          else
            echo "auth_method=none" >> "$GITHUB_OUTPUT"
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GCP Secrets Missing::Google Cloud deployment secrets are not configured in GitHub repository settings. Skipping Cloud Run deployment."
            echo "### ⚠️ Google Cloud Run Deployment Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No Google Cloud credentials were found in GitHub repository secrets." >> "$GITHUB_STEP_SUMMARY"
            echo "To enable Cloud Run deployment, configure GCP_PROJECT_ID and GCP credentials in Repository Settings." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: steps.check-auth.outputs.auth_method == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key)
        if: steps.check-auth.outputs.auth_method == 'key'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS_JSON }}

      - name: Set up Cloud SDK
        if: steps.check-auth.outputs.can_deploy == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.check-auth.outputs.can_deploy == 'true'
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        if: steps.check-auth.outputs.can_deploy == 'true'
        working-directory: server
        run: |
          docker build \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/geoagent/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/geoagent/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        if: steps.check-auth.outputs.can_deploy == 'true'
        run: |
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/geoagent/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/geoagent/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        if: steps.check-auth.outputs.can_deploy == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/geoagent/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: |
            --port=8080
            --min-instances=1
            --max-instances=1
            --cpu=1
            --memory=512Mi
            --timeout=300
            --concurrency=80
            --allow-unauthenticated
            --set-env-vars=NODE_ENV=production,COMMIT_SHA=${{ github.sha }}

      - name: Verify deployment health
        if: steps.check-auth.outputs.can_deploy == 'true'
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "Service URL: $SERVICE_URL"
          sleep 10
          curl -sf "${SERVICE_URL}/api/health/live" || (echo "Health check failed" && exit 1)
          echo "✅ Deployment healthy"
