# ─────────────────────────────────────────────────────────
# SwiftCare GeoAgent — Deploy Backend to Cloud Run
# Runs only on push to main (after CI passes)
# ─────────────────────────────────────────────────────────
name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'

# Prevent concurrent deployments
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVICE_NAME: geoagent-backend
  IMAGE_NAME: geoagent-backend

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    # Required for Workload Identity Federation
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        working-directory: server
        run: |
          docker build \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/geoagent/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/geoagent/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/geoagent/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/geoagent/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/geoagent/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: |
            --port=8080
            --min-instances=1
            --max-instances=1
            --cpu=1
            --memory=512Mi
            --timeout=300
            --concurrency=80
            --allow-unauthenticated
            --set-env-vars=NODE_ENV=production,COMMIT_SHA=${{ github.sha }}

      - name: Verify deployment health
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ secrets.GCP_REGION }} \
            --format='value(status.url)')
          echo "Service URL: $SERVICE_URL"
          # Wait for service to be ready
          sleep 10
          curl -sf "${SERVICE_URL}/api/health/live" || (echo "Health check failed" && exit 1)
          echo "✅ Deployment healthy"
