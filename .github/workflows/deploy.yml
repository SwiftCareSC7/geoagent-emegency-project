# ─────────────────────────────────────────────────────────
# SwiftCare GeoAgent — Backend Deployment Workflow (Cloud Run)
# 
# NOTE: Production backend runs on Render via render.yaml.
# Render auto-deploys on git push to the main branch.
#
# This Google Cloud Run workflow is kept as a ready-to-use template.
# To activate Cloud Run deployment:
# 1. Add your GCP credentials in GitHub Repository Settings:
#    Settings → Secrets and variables → Actions:
#      - GCP_PROJECT_ID
#      - GCP_WORKLOAD_IDENTITY_PROVIDER & GCP_SERVICE_ACCOUNT (or GCP_SA_KEY)
# 2. Uncomment the jobs section below.
# ─────────────────────────────────────────────────────────
name: Deploy Backend (Cloud Run - Inactive)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

